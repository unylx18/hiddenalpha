name: HiddenAlpha V2 release validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Build-only placeholder credentials, NOT real Supabase access.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-build-only-anon-key
      # Do not pass CRON_SECRET, OANDA credentials, or service-role keys to CI.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Dependency audit inventory (read-only, informational)
        run: |
          npm audit --json > /tmp/hiddenalpha-audit-all.json || true
          npm audit --omit=dev --json > /tmp/hiddenalpha-audit-runtime.json || true
          node - <<'NODE'
          const fs = require("node:fs");
          for (const [kind,path] of [
            ["ALL","/tmp/hiddenalpha-audit-all.json"],
            ["RUNTIME","/tmp/hiddenalpha-audit-runtime.json"],
          ]) {
            try {
              const doc = JSON.parse(fs.readFileSync(path,"utf8"));
              if(doc.error) {console.log("AUDIT_ERROR",kind,JSON.stringify(doc.error));continue;}
              console.log("AUDIT_TOTAL",kind,JSON.stringify(doc.metadata?.vulnerabilities??{}));
              for(const [name,v] of Object.entries(doc.vulnerabilities??{})){
                const via=(v.via??[]).filter(x=>typeof x==="object").map(x=>({
                  name:x.name,severity:x.severity,title:x.title,range:x.range,url:x.url,
                }));
                console.log("AUDIT_FINDING",kind,JSON.stringify({
                  name,severity:v.severity,range:v.range,isDirect:v.isDirect,
                  fixAvailable:v.fixAvailable,via,effects:v.effects,
                }));
              }
            } catch(error) {
              console.log("AUDIT_READ_ERROR",kind,error.message);
            }
          }
          NODE
      - name: V2 pure model regression
        run: node --test scripts/v2-risk.test.mjs scripts/v2-journal.test.mjs scripts/v2-portfolio.test.mjs scripts/v2-levels.test.mjs scripts/v2-watch.test.mjs scripts/v2-market-scanner.test.mjs scripts/v2-preferences.test.mjs scripts/v2-onboarding.test.mjs
      - name: V2 scoped ESLint
        run: npx eslint app/v2 app/api/v2 components/v2 lib/trading/v2 lib/market-data/oanda-candles.ts scripts/v2-smoke.mjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Next.js production build
        run: npm run build
      - name: Built-server HTTP route smoke
        run: node scripts/v2-http-smoke.mjs

  lockfile-security-refresh:
    # Temporary guarded one-time lockfile refresh. Removed once audited/committed.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/hiddenalpha-v2-visual-terminal' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Regenerate lock safely (no lifecycle scripts)
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          git diff --exit-code -- package.json
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=low
      - name: Commit only audited package-lock.json to V2 feature branch
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already updated'; exit 0
          fi
          git config user.name 'hiddenalpha-security-ci'
          git config user.email 'security-ci@users.noreply.github.com'
          git commit -m 'fix(deps): update lockfile to patched runtime dependency versions'
          git push origin HEAD:refs/heads/feat/hiddenalpha-v2-visual-terminal
